name: Odoo Code Quality Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Check Python Syntax
      run: |
        FILES=$(find . -name "*.py")
        if [ -n "$FILES" ]; then
          python -m py_compile $FILES
          echo " Código Python validado correctamente."
        else
          echo " No se encontraron archivos .py para analizar aún."
        fi
